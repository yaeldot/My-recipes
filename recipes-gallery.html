<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>המתכונים שלי</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap');

  @font-face {
    font-family: 'Polin';
    src: url('Polin-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
  }
  @font-face {
    font-family: 'Polin';
    src: url('Polin-Semibold.woff2') format('woff2');
    font-weight: 600;
    font-style: normal;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf7f4;
    --card: #ffffff;
    --accent: #c8845a;
    --accent-light: #f5e8de;
    --text: #2d2418;
    --text-muted: #9c8472;
    --border: #ede8e3;
    --shadow: 0 2px 16px rgba(60,30,10,0.07);
    --radius: 16px;
  }

  body { font-family: 'Polin', 'Heebo', sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }

  /* HEADER */
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 1.7rem; font-weight: 600; color: var(--accent); font-family: 'Polin', 'Heebo', sans-serif; }
  .header-actions { display: flex; align-items: center; gap: 12px; }

  .search-bar {
    display: flex; align-items: center;
    background: var(--bg); border: 1px solid var(--border); border-radius: 100px;
    padding: 8px 16px; gap: 8px; width: 220px;
  }
  .search-bar input {
    border: none; background: transparent; font-family: 'Heebo', sans-serif;
    font-size: 0.9rem; color: var(--text); outline: none; width: 100%;
  }
  .search-bar svg { color: var(--text-muted); flex-shrink: 0; }

  .btn-upload {
    display: flex; align-items: center; gap: 8px;
    background: var(--accent); color: white; border: none; border-radius: 100px;
    padding: 10px 20px; font-family: 'Heebo', sans-serif; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-upload:hover { opacity: 0.88; }

  /* CATEGORIES */
  .categories { display: flex; gap: 10px; padding: 20px 32px; overflow-x: auto; scrollbar-width: none; }
  .categories::-webkit-scrollbar { display: none; }

  .cat-chip {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 16px; border-radius: 100px;
    border: 1.5px solid var(--border); background: var(--card);
    font-size: 0.875rem; font-weight: 500; white-space: nowrap;
    cursor: pointer; transition: all 0.18s; color: var(--text-muted);
  }
  .cat-chip.active, .cat-chip:hover { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .cat-chip svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* MAIN */
  main { padding: 4px 32px 48px; }
  .section-title { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px; }

  /* MASONRY GRID */
  .gallery { columns: 4; column-gap: 16px; }
  @media (max-width: 1100px) { .gallery { columns: 3; } }
  @media (max-width: 760px)  { .gallery { columns: 2; } }
  @media (max-width: 480px)  { .gallery { columns: 1; } }

  .recipe-card {
    break-inside: avoid; background: var(--card); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow); margin-bottom: 16px;
    cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; position: relative;
  }
  .recipe-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(60,30,10,0.13); }
  .recipe-card img { width: 100%; height: 220px; display: block; object-fit: cover; }

  .card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(30,15,5,0.55) 0%, transparent 55%);
    opacity: 0; transition: opacity 0.2s;
    display: flex; align-items: flex-end; padding: 14px;
    /* only covers the image part, not the info below */
    bottom: auto; height: calc(100% - 80px);
  }
  .recipe-card:hover .card-overlay { opacity: 1; }

  .card-actions { display: flex; gap: 8px; }
  .card-action-btn {
    background: rgba(255,255,255,0.9); border: none; border-radius: 50%;
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.15s; color: var(--text);
  }
  .card-action-btn:hover { background: white; }

  .card-tag {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,255,255,0.92); border-radius: 100px;
    padding: 3px 10px; font-size: 0.72rem; font-weight: 600; color: var(--accent);
  }

  .card-info { padding: 11px 13px 13px; }
  .card-title { font-size: 0.88rem; font-weight: 600; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-source { font-size: 0.76rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
  .card-source svg { width: 11px; height: 11px; flex-shrink: 0; }

  /* EMPTY */
  .empty { text-align: center; padding: 80px 32px; color: var(--text-muted); display: none; }
  .empty svg { width: 52px; height: 52px; margin-bottom: 16px; opacity: 0.35; }
  .empty h3 { font-size: 1.15rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }

  /* ── ADD RECIPE MODAL ── */
  .backdrop {
    position: fixed; inset: 0; background: rgba(20,10,5,0.7);
    z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .backdrop.open { display: flex; }

  /* view modal */
  .view-modal { background: var(--card); border-radius: 20px; max-width: 540px; width: 100%; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.3); }
  .view-modal img { width: 100%; max-height: 65vh; object-fit: contain; background: #f5ede5; display: block; }
  .view-modal-footer { padding: 16px 20px; display: flex; align-items: flex-start; justify-content: space-between; }
  .view-modal-footer .info { flex: 1; }
  .view-modal-footer .info h3 { font-size: 1rem; font-weight: 600; margin-bottom: 3px; }
  .view-modal-footer .info .src { font-size: 0.82rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
  .view-modal-footer .info .src svg { width: 13px; height: 13px; }
  .modal-tag { font-size: 0.78rem; color: var(--accent); font-weight: 600; background: var(--accent-light); padding: 3px 10px; border-radius: 100px; display: inline-block; }
  .icon-btn { background: var(--bg); border: 1px solid var(--border); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: var(--text-muted); }
  .icon-btn:hover { color: var(--text); }

  /* add modal */
  .add-modal { background: var(--card); border-radius: 20px; max-width: 480px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,0.3); overflow: hidden; }
  .add-modal-header { padding: 20px 22px 0; display: flex; align-items: center; justify-content: space-between; }
  .add-modal-header h2 { font-size: 1.05rem; font-weight: 700; }
  .add-modal-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; }

  .img-preview-wrap {
    width: 100%; height: 200px; border-radius: 12px; overflow: hidden;
    background: var(--accent-light); border: 2px dashed var(--accent);
    display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative;
  }
  .img-preview-wrap img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .img-preview-wrap .placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--accent); font-size: 0.88rem; font-weight: 500; }
  .img-preview-wrap .placeholder svg { width: 32px; height: 32px; }
  .img-preview-wrap.has-img img { display: block; }
  .img-preview-wrap.has-img .placeholder { display: none; }

  .field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 10px;
    font-family: 'Heebo', sans-serif; font-size: 0.9rem; color: var(--text);
    background: var(--bg); outline: none; transition: border-color 0.18s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }

  .add-modal-footer { padding: 0 22px 22px; display: flex; gap: 10px; }
  .btn-cancel { flex: 1; padding: 11px; border: 1.5px solid var(--border); border-radius: 10px; background: transparent; font-family: 'Heebo', sans-serif; font-size: 0.9rem; cursor: pointer; color: var(--text-muted); }
  .btn-save { flex: 2; padding: 11px; background: var(--accent); color: white; border: none; border-radius: 10px; font-family: 'Heebo', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
  .btn-save:hover { opacity: 0.88; }
  .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
    המתכונים שלי
  </div>
  <div class="header-actions">
    <div class="search-bar">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="חפשי מתכון..." id="searchInput" oninput="filterRecipes()" />
    </div>
    <button class="btn-upload" onclick="openAddModal()">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      הוספת מתכון
    </button>
  </div>
</header>

<!-- CATEGORIES -->
<div class="categories" id="catBar">
  <div class="cat-chip active" data-cat="הכל">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    הכל
  </div>
  <div class="cat-chip" data-cat="סלטים">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 12 2.5 7"/><path d="M12 12v10"/><path d="M15.5 4.5 12 12l7-2"/></svg>
    סלטים
  </div>
  <div class="cat-chip" data-cat="פסטה ואורז">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 11v3a9 9 0 0 0 18 0v-3"/><path d="M12 11V2"/><path d="M8 6l4-4 4 4"/></svg>
    פסטה ואורז
  </div>
  <div class="cat-chip" data-cat="עוף ובשר">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M15 11v4.833A1.166 1.166 0 0 1 13.833 17H9.167A1.167 1.167 0 0 1 8 15.833V11"/><path d="m5 11 1-7h12l1 7"/><path d="M4.5 11h15"/><path d="M10 7 9 3"/><path d="m14 7 1-4"/></svg>
    עוף ובשר
  </div>
  <div class="cat-chip" data-cat="דגים">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M6.5 12c0-5 3-9 9.5-9S22 8 22 12s-2 9-6 9c-3 0-4.5-2-4.5-2s-5 1-7-4c2 0 4-1 4-1S6.5 14 6.5 12z"/><circle cx="17" cy="10" r="1" fill="currentColor"/><path d="M2 12s1.5-2 4-2"/></svg>
    דגים
  </div>
  <div class="cat-chip" data-cat="חלבי">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M8 2h8l1 9H7L8 2z"/><path d="M7 11c0 5 2 8 5 8s5-3 5-8"/><path d="M10 6h4"/></svg>
    חלבי
  </div>
  <div class="cat-chip" data-cat="קינוחים">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2 1 2 1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/></svg>
    קינוחים
  </div>
  <div class="cat-chip" data-cat="אפייה">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M3 11h18"/><path d="M12 3v8"/><path d="M7.5 8A2.5 2.5 0 0 1 5 5.5C5 4.1 6.1 3 7.5 3S10 4.1 10 5.5"/><path d="M16.5 8A2.5 2.5 0 0 0 19 5.5C19 4.1 17.9 3 16.5 3S14 4.1 14 5.5"/><path d="M3 11c0 5 2 9 9 9s9-4 9-9"/></svg>
    אפייה
  </div>
  <div class="cat-chip" data-cat="שתייה">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M8 2h8l1 9H7L8 2z"/><path d="M7 11c0 5 2 8 5 8s5-3 5-8"/><path d="M15 6c1-1 3-1 3 1s-2 3-3 3"/></svg>
    שתייה
  </div>
  <div class="cat-chip" data-cat="כללי">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
    כללי
  </div>
</div>

<main>
  <div class="section-title">כל המתכונים · <span id="count">0</span></div>
  <div class="gallery" id="gallery"></div>
  <div class="empty" id="emptyState">
    <svg fill="none" stroke="currentColor" stroke-width="1.3" viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
    <h3>עדיין אין מתכונים כאן</h3>
    <p>לחצי על "הוספת מתכון" כדי להתחיל לאסוף</p>
  </div>
</main>

<!-- VIEW MODAL -->
<div class="backdrop" id="viewBackdrop" onclick="closeView(event)">
  <div class="view-modal">
    <img id="viewImg" src="" alt="" />
    <div class="view-modal-footer">
      <div class="info">
        <h3 id="viewTitle"></h3>
        <div class="src" id="viewSource"></div>
        <span class="modal-tag" id="viewTag"></span>
      </div>
      <button class="icon-btn" onclick="closeView()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- ADD RECIPE MODAL -->
<div class="backdrop" id="addBackdrop" onclick="closeAdd(event)">
  <div class="add-modal" onclick="event.stopPropagation()">
    <div class="add-modal-header">
      <h2>הוספת מתכון</h2>
      <button class="icon-btn" onclick="closeAdd()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="add-modal-body">
      <!-- image picker -->
      <div class="img-preview-wrap" id="imgPreviewWrap" onclick="document.getElementById('fileInput').click()">
        <img id="previewImg" src="" alt="" />
        <div class="placeholder">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          לחצי לבחירת תמונה
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewSelected(this)" />

      <div class="field">
        <label>שם המתכון</label>
        <input type="text" id="inputTitle" placeholder="לדוג׳ עוגת שוקולד לחה" />
      </div>
      <div class="field">
        <label>ממי קיבלת?</label>
        <input type="text" id="inputSource" placeholder="לדוג׳ מאמא / סטטוס של דנה / האתר של ענת" />
      </div>
      <div class="field">
        <label>קטגוריה</label>
        <select id="inputTag">
          <option value="כללי">כללי</option>
          <option value="סלטים">סלטים</option>
          <option value="פסטה ואורז">פסטה ואורז</option>
          <option value="עוף ובשר">עוף ובשר</option>
          <option value="דגים">דגים</option>
          <option value="חלבי">חלבי</option>
          <option value="קינוחים">קינוחים</option>
          <option value="אפייה">אפייה</option>
          <option value="שתייה">שתייה</option>
        </select>
      </div>
    </div>
    <div class="add-modal-footer">
      <button class="btn-cancel" onclick="closeAdd()">ביטול</button>
      <button class="btn-save" id="btnSave" onclick="saveRecipe()">שמירה</button>
    </div>
  </div>
</div>

<script>
  const CATEGORIES = ['סלטים','פסטה ואורז','עוף ובשר','דגים','צמחוני','קינוחים','אפייה','ארוחות בוקר','שתייה','כללי'];

  const demos = [
    { src: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400', tag: 'סלטים', title: 'סלט ירוק עם טחינה', source: 'מאמא' },
    { src: 'https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=400', tag: 'ארוחות בוקר', title: 'פנקייקס תפוחים', source: 'סטטוס של דנה' },
    { src: 'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=400', tag: 'כללי', title: 'פיצה ביתית', source: 'האתר של ענת אברהם' },
    { src: 'https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?w=400', tag: 'סלטים', title: 'בולגרית קלאסית', source: 'סטטוס של מיכל' },
    { src: 'https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=400', tag: 'קינוחים', title: 'עוגת שוקולד לחה', source: 'מאמא' },
    { src: 'https://images.unsplash.com/photo-1482049016688-2d3e1b311543?w=400', tag: 'ארוחות בוקר', title: 'טוסט אבוקדו', source: 'אינסטגרם' },
    { src: 'https://images.unsplash.com/photo-1484723091739-30a097e8f929?w=400', tag: 'אפייה', title: 'בריוש חמאה', source: 'הבלוג של נטלי' },
    { src: 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=400', tag: 'צמחוני', title: 'קערת בודהה', source: 'סטטוס של ליאת' },
  ];

  let recipes = [...demos];
  let activeCat = 'הכל';
  let pendingDataUrl = null;

  function filtered() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    return recipes.filter(r => {
      const catOk = activeCat === 'הכל' || r.tag === activeCat;
      const qOk = !q || r.title.toLowerCase().includes(q) || (r.source||'').toLowerCase().includes(q);
      return catOk && qOk;
    });
  }

  function renderGallery() {
    const list = filtered();
    const gallery = document.getElementById('gallery');
    const empty   = document.getElementById('emptyState');
    document.getElementById('count').textContent = list.length;

    if (list.length === 0) { gallery.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    gallery.innerHTML = list.map((r, i) => {
      const idx = recipes.indexOf(r);
      return `
        <div class="recipe-card" onclick="openView(${idx})">
          <img src="${r.src}" alt="מתכון" loading="lazy" />
          <div class="card-tag">${r.tag}</div>
          <div class="card-overlay">
            <div class="card-actions">
              <button class="card-action-btn" title="מחק" onclick="deleteRecipe(event,${idx})">
                <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
              </button>
            </div>
          </div>
          <div class="card-info">
            <div class="card-title">${r.title || 'מתכון ללא שם'}</div>
            ${r.source ? `<div class="card-source">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              ${r.source}
            </div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  function deleteRecipe(e, i) {
    e.stopPropagation();
    if (!confirm('למחוק את המתכון?')) return;
    recipes.splice(i, 1);
    renderGallery();
  }

  // VIEW MODAL
  function openView(i) {
    const r = recipes[i];
    document.getElementById('viewImg').src = r.src;
    document.getElementById('viewTitle').textContent = r.title || 'מתכון ללא שם';
    document.getElementById('viewTag').textContent = r.tag;
    const srcEl = document.getElementById('viewSource');
    if (r.source) {
      srcEl.innerHTML = `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${r.source}`;
    } else { srcEl.innerHTML = ''; }
    document.getElementById('viewBackdrop').classList.add('open');
  }
  function closeView(e) {
    if (!e || e.target === document.getElementById('viewBackdrop'))
      document.getElementById('viewBackdrop').classList.remove('open');
  }

  // ADD MODAL
  function openAddModal() {
    pendingDataUrl = null;
    document.getElementById('previewImg').src = '';
    document.getElementById('imgPreviewWrap').classList.remove('has-img');
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputSource').value = '';
    document.getElementById('inputTag').value = 'כללי';
    document.getElementById('fileInput').value = '';
    document.getElementById('addBackdrop').classList.add('open');
  }
  function closeAdd(e) {
    if (!e || e.target === document.getElementById('addBackdrop'))
      document.getElementById('addBackdrop').classList.remove('open');
  }

  function previewSelected(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      pendingDataUrl = ev.target.result;
      const img = document.getElementById('previewImg');
      img.src = pendingDataUrl;
      document.getElementById('imgPreviewWrap').classList.add('has-img');
    };
    reader.readAsDataURL(file);
  }

  function saveRecipe() {
    if (!pendingDataUrl) { alert('נא לבחור תמונה'); return; }
    const title  = document.getElementById('inputTitle').value.trim() || 'מתכון ללא שם';
    const source = document.getElementById('inputSource').value.trim();
    const tag    = document.getElementById('inputTag').value;
    recipes.unshift({ src: pendingDataUrl, tag, title, source });
    renderGallery();
    closeAdd();
  }

  // CATEGORY FILTER
  document.querySelectorAll('.cat-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeCat = chip.dataset.cat;
      renderGallery();
    });
  });

  function filterRecipes() { renderGallery(); }

  renderGallery();
</script>
</body>
</html>
